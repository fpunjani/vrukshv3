name: Apply JE3 Reachable-Volume Diagnostics

on:
  push:
    branches:
      - v3-spatial-depth-je3-reachable-volume

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage JE3 candidate reachability diagnostics v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-spatial-depth-je3-reachable-volume

      - name: Inject exact candidate-set diagnostic
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()
          marker = 'export function growStructuralEvent(\n  state: TreeState,\n  eventIndex: number,\n): GrowthModule | null {\n'
          if text.count(marker) != 1:
            raise SystemExit(f'growStructuralEvent marker count={text.count(marker)}')
          snippet = Path('src/domain/je3-reachability-snippet.txt').read_text()
          text = text.replace(marker, snippet + marker, 1)
          path.write_text(text)

      - name: Commit diagnostic and remove temporary carrier files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm src/domain/je3-reachability-snippet.txt .github/workflows/je3-apply.yml
          git add src/domain/structure.ts
          git commit -m "Expose exact mature candidate reachability diagnostic"
          git push origin HEAD:v3-spatial-depth-je3-reachable-volume
