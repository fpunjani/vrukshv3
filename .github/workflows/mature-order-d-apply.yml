name: Apply Post-1k Branch-Order Depth D

on:
  push:
    branches:
      - v3-mature-unbounded-order-d

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage post-1k branch-order depth D'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-unbounded-order-d

      - name: Remove artificial terminal-order cap after 1000
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          old = '    if (parent.order > MAX_ORDER) continue;'
          new = '    if (eventIndex <= 1000 && parent.order > MAX_ORDER) continue;'
          if text.count(old) != 1:
            raise SystemExit(f'continuation MAX_ORDER marker count={text.count(old)}')
          text = text.replace(old, new)

          old = '    if (parent.order >= MAX_ORDER) continue;'
          new = '    if (eventIndex <= 1000 && parent.order >= MAX_ORDER) continue;'
          if text.count(old) != 1:
            raise SystemExit(f'lateral MAX_ORDER marker count={text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text)

      - name: Commit prototype D
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts
          git commit -m "Prototype post-1k branch-order depth D"
          git push origin HEAD:v3-mature-unbounded-order-d
