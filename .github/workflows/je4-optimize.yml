name: Optimize JE4 Steering Context

on:
  push:
    branches:
      - v3-spatial-depth-je4-opportunity-steered-candidates

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage JE4 steering-context optimization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-spatial-depth-je4-opportunity-steered-candidates

      - name: Cache mature steering field once per structural event
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          start = text.index('function matureSteeringAttractors(')
          end = text.index('\nfunction steeredContinuationDepthDelta(', start)
          replacement = '''interface IndexedMatureAttractor {\n  attractor: NormalizedVolumePoint;\n  index: number;\n}\n\nfunction uncolonizedMatureSteeringAttractors(\n  state: TreeState,\n  context: GrowthContext,\n  eventIndex: number,\n): IndexedMatureAttractor[] {\n  const terminalTips = context.axisTips\n    .map((tip) => context.spatialById.get(tip.id))\n    .filter((tip): tip is ProjectedSpatialSegment => Boolean(tip))\n    .map((tip) =>\n      normalizedMaturePoint(context, eventIndex, tip.end, tip.endDepth),\n    );\n  const KILL_RADIUS = 0.13;\n  const available: IndexedMatureAttractor[] = [];\n\n  for (let index = 0; index < 32; index += 1) {\n    const attractor = matureAttractor(state.soul, index);\n    let currentDistance = Number.POSITIVE_INFINITY;\n    for (const tip of terminalTips) {\n      currentDistance = Math.min(\n        currentDistance,\n        normalizedDistance(tip, attractor),\n      );\n    }\n    if (currentDistance <= KILL_RADIUS) continue;\n    available.push({ attractor, index });\n  }\n\n  return available;\n}\n\nfunction nearestMatureSteeringAttractors(\n  context: GrowthContext,\n  eventIndex: number,\n  parentPoint: Point,\n  parentDepth: number,\n  available: readonly IndexedMatureAttractor[],\n  limit = 2,\n): NormalizedVolumePoint[] {\n  const parentNormalized = normalizedMaturePoint(\n    context,\n    eventIndex,\n    parentPoint,\n    parentDepth,\n  );\n  return [...available]\n    .sort(\n      (a, b) =>\n        normalizedDistance(parentNormalized, a.attractor) -\n          normalizedDistance(parentNormalized, b.attractor) ||\n        a.index - b.index,\n    )\n    .slice(0, Math.max(0, limit))\n    .map((item) => item.attractor);\n}\n'''
          text = text[:start] + replacement + text[end:]

          old = '''  const result: Candidate[] = [];\n\n  for (const parent of state.modules) {\n'''
          new = '''  const result: Candidate[] = [];\n  const steeringAttractors =\n    eventIndex > MATURE_STRUCTURE_HORIZON\n      ? uncolonizedMatureSteeringAttractors(state, context, eventIndex)\n      : [];\n\n  for (const parent of state.modules) {\n'''
          # continuationCandidates is the first occurrence after its function start.
          function_start = text.index('function continuationCandidates(')
          occurrence = text.find(old, function_start)
          if occurrence < 0:
            raise SystemExit('continuation result marker not found')
          text = text[:occurrence] + text[occurrence:].replace(old, new, 1)

          old = '''      const targets = matureSteeringAttractors(\n        state,\n        context,\n        eventIndex,\n        projection.end,\n        spatialParent.endDepth,\n        2,\n      );\n'''
          new = '''      const targets = nearestMatureSteeringAttractors(\n        context,\n        eventIndex,\n        projection.end,\n        spatialParent.endDepth,\n        steeringAttractors,\n        2,\n      );\n'''
          if text.count(old) != 1:
            raise SystemExit(f'target-call marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          if 'matureSteeringAttractors(' in text:
            raise SystemExit('old per-parent steering helper remains')
          for needle in [
            'uncolonizedMatureSteeringAttractors(state, context, eventIndex)',
            'nearestMatureSteeringAttractors(',
            'const steeringAttractors =',
          ]:
            if needle not in text:
              raise SystemExit(f'missing optimization marker {needle}')
          path.write_text(text)

      - name: Commit optimization and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/je4-optimize.yml
          git add src/domain/structure.ts
          git commit -m "Cache JE4 mature steering field per structural event"
          git push origin HEAD:v3-spatial-depth-je4-opportunity-steered-candidates
