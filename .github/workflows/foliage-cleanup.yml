name: Clean foliage acceptance artifacts

on:
  push:
    branches:
      - v3-foliage-attachment
    paths:
      - .github/workflows/foliage-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-foliage-attachment

      - name: Require completed acceptance gate
        run: test -f qa/FOLIAGE_GATE_OK.txt

      - name: Remove temporary acceptance machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r qa
          git rm .github/workflows/foliage-acceptance.yml
          git rm .github/workflows/foliage-cleanup.yml
          git commit -m "Cleanup temporary foliage acceptance artifacts"
          git push origin HEAD:v3-foliage-attachment
