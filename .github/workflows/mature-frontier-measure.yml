name: Mature Frontier Measure

on:
  workflow_dispatch:
  push:
    branches:
      - v3-mature-frontier-diagnostics

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Measure mature frontier
        shell: bash
        env:
          MATURE_FRONTIER_MEASURE: "1"
        run: |
          set -euo pipefail
          npm exec vitest run src/domain/mature-frontier.measure.test.ts --reporter=verbose 2>&1 | tee mature-frontier-report.txt

      - name: Upload measurement report
        uses: actions/upload-artifact@v7
        with:
          name: mature-frontier-report
          path: mature-frontier-report.txt
          if-no-files-found: error
          retention-days: 14
