name: Measure V3 mechanics

on:
  push:
    branches:
      - v3-scaffold-crown
    paths:
      - src/domain/measure-mechanics.test.ts
      - .github/workflows/measure-mechanics.yml

permissions:
  contents: write

jobs:
  measure:
    if: ${{ !contains(github.event.head_commit.message, 'Record measured V3 mechanics') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-scaffold-crown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Measure mechanics
        run: npx vitest run src/domain/measure-mechanics.test.ts

      - name: Record measurement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mechanics-measured.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record measured V3 mechanics"
          git push origin HEAD:v3-scaffold-crown
