name: Apply Mature Crown Envelope H

on:
  push:
    branches:
      - v3-mature-envelope-h

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage mature crown envelope H'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-envelope-h

      - name: Apply mature envelope
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          def once(old, new, label):
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 marker, found {count}')
            text = text.replace(old, new, 1)

          once(
            '  bounds: Bounds;\n  continuationParents: Set<string>;\n',
            '  bounds: Bounds;\n  matureReferenceBounds: Bounds;\n  continuationParents: Set<string>;\n',
            'context mature bounds field',
          )

          once(
            '  const projectedById = new Map(segments.map((segment) => [segment.id, segment]));\n',
            '  const projectedById = new Map(segments.map((segment) => [segment.id, segment]));\n  const matureReferenceBounds = boundsFor(\n    segments.filter((segment) => segment.bornAtEvent <= MATURE_STRUCTURE_HORIZON),\n  );\n',
            'compute mature reference bounds',
          )

          once(
            '    bounds: boundsFor(segments),\n    continuationParents,\n',
            '    bounds: boundsFor(segments),\n    matureReferenceBounds,\n    continuationParents,\n',
            'return mature reference bounds',
          )

          marker = '''function violatesBroadCrownEnvelope(\n'''
          helper = '''function insideMatureCrownEnvelope(\n  context: GrowthContext,\n  eventIndex: number,\n  end: Point,\n): boolean {\n  if (eventIndex <= MATURE_STRUCTURE_HORIZON) return true;\n\n  const ageRatio = Math.max(1, eventIndex / MATURE_STRUCTURE_HORIZON);\n  const ageLog = Math.log2(ageRatio);\n  const horizontalScale = 1 + ageLog * 0.18;\n  const verticalScale = 1 + ageLog * 0.14;\n  const reference = context.matureReferenceBounds;\n\n  // Scale the accepted young crown around the structural root. A small\n  // fine-twig cushion prevents a discontinuous freeze immediately after the\n  // 1k horizon while remaining negligible at long-life scale.\n  const cushion = 6;\n  const minX = reference.minX * horizontalScale - cushion;\n  const maxX = reference.maxX * horizontalScale + cushion;\n  const minY = reference.minY * verticalScale - cushion;\n\n  return (\n    end.x >= minX - 1e-9 &&\n    end.x <= maxX + 1e-9 &&\n    end.y >= minY - 1e-9 &&\n    end.y <= 1e-9\n  );\n}\n\n'''
          once(marker, helper + marker, 'insert mature envelope helper')

          once(
            '  if (candidate.length <= 0.5) return null;\n  if (violatesBroadCrownEnvelope(context.bounds, end, state.modules.length)) {\n',
            '  if (candidate.length <= 0.5) return null;\n  if (!insideMatureCrownEnvelope(context, eventIndex, end)) return null;\n  if (violatesBroadCrownEnvelope(context.bounds, end, state.modules.length)) {\n',
            'apply mature envelope before scoring',
          )

          required = [
            'matureReferenceBounds: Bounds;',
            'function insideMatureCrownEnvelope(',
            'const horizontalScale = 1 + ageLog * 0.18;',
            'const verticalScale = 1 + ageLog * 0.14;',
            '!insideMatureCrownEnvelope(context, eventIndex, end)',
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
            raise SystemExit(f'missing H markers: {missing}')

          path.write_text(text)

      - name: Commit H
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts
          git commit -m "Prototype mature crown envelope H"
          git push origin HEAD:v3-mature-envelope-h
