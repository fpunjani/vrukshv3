name: Apply Mature Policy Prototype

on:
  push:
    branches:
      - v3-mature-frontier-policy-a

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Prototype mature dormancy regulation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-frontier-policy-a

      - name: Apply narrow post-1k mature policy
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/domain/structure.ts')
          text = path.read_text()

          text = text.replace(
              'const HARD_MATURE_ASPECT = 1.02;\n',
              'const HARD_MATURE_ASPECT = 1.02;\nconst MATURE_STRUCTURE_HORIZON = 1000;\n',
          )

          text = text.replace(
              '  lateralFromAxisCounts: Map<string, number>;\n  latestAxisModulePositions: Map<string, number>;\n',
              '  lateralFromAxisCounts: Map<string, number>;\n  modulePositions: Map<string, number>;\n  latestAxisModulePositions: Map<string, number>;\n',
          )

          text = text.replace(
              '  const lateralFromAxisCounts = new Map<string, number>();\n  const latestAxisModulePositions = new Map<string, number>();\n',
              '  const lateralFromAxisCounts = new Map<string, number>();\n  const modulePositions = new Map<string, number>();\n  const latestAxisModulePositions = new Map<string, number>();\n',
          )

          text = text.replace(
              '    axisModuleCounts.set(module.axisId, (axisModuleCounts.get(module.axisId) ?? 0) + 1);\n    latestAxisModulePositions.set(module.axisId, index);\n',
              '    axisModuleCounts.set(module.axisId, (axisModuleCounts.get(module.axisId) ?? 0) + 1);\n    modulePositions.set(module.id, index);\n    latestAxisModulePositions.set(module.axisId, index);\n',
          )

          text = text.replace(
              '    lateralFromAxisCounts,\n    latestAxisModulePositions,\n',
              '    lateralFromAxisCounts,\n    modulePositions,\n    latestAxisModulePositions,\n',
          )

          marker = '''function architectureScore(\n  state: TreeState,\n'''
          mature_policy = '''function matureDormancyPenalty(\n  state: TreeState,\n  context: GrowthContext,\n  candidate: Omit<Candidate, "score">,\n): number {\n  if (state.growthIndex < MATURE_STRUCTURE_HORIZON) return 0;\n\n  if (candidate.relation === "lateral") {\n    const parentPosition = context.modulePositions.get(candidate.parent.id);\n    if (parentPosition === undefined) return 0;\n    const structuralAge = state.modules.length - 1 - parentPosition;\n    if (structuralAge <= 24) return 0;\n\n    // Juvenile buds gain readiness with age so the young crown can establish.\n    // In a mature organism, long-unused buds should become progressively less\n    // likely to define ordinary crown growth unless a future disturbance model\n    // explicitly reactivates them.\n    const baseDecay = (structuralAge - 24) * 0.012;\n    const deepDormancy = Math.max(0, structuralAge - 100) * 0.004;\n    return Math.min(2.4, baseDecay + deepDormancy);\n  }\n\n  const latestAxisPosition =\n    context.latestAxisModulePositions.get(candidate.parent.axisId);\n  if (latestAxisPosition === undefined) return 0;\n  const dormancyGap = state.modules.length - 1 - latestAxisPosition;\n  if (dormancyGap <= 24) return 0;\n\n  const baseDecay = (dormancyGap - 24) * 0.008;\n  const deepDormancy = Math.max(0, dormancyGap - 100) * 0.004;\n  return Math.min(1.8, baseDecay + deepDormancy);\n}\n\n'''
          if marker not in text:
              raise SystemExit('architectureScore insertion marker not found')
          text = text.replace(marker, mature_policy + marker, 1)

          text = text.replace(
              '    architectureScore(state, context, candidate, traits) -\n    structuralRecencyPenalty(state, context, candidate) +\n',
              '    architectureScore(state, context, candidate, traits) -\n    structuralRecencyPenalty(state, context, candidate) -\n    matureDormancyPenalty(state, context, candidate) +\n',
          )

          text = text.replace(
              '    const order = parent.order + 1;\n    const divergence = lateralDivergence(\n',
              '    const order = parent.order + 1;\n    if (eventIndex > MATURE_STRUCTURE_HORIZON && order === 1) continue;\n    const divergence = lateralDivergence(\n',
          )

          required = [
              'const MATURE_STRUCTURE_HORIZON = 1000;',
              'modulePositions: Map<string, number>;',
              'function matureDormancyPenalty(',
              'matureDormancyPenalty(state, context, candidate)',
              'eventIndex > MATURE_STRUCTURE_HORIZON && order === 1',
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f'missing patched markers: {missing}')

          path.write_text(text)

      - name: Commit prototype
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts
          git commit -m "Prototype mature dormancy regulation"
          git push origin HEAD:v3-mature-frontier-policy-a
