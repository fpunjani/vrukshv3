name: JE4 Candidate Reachability Measure

on:
  push:
    branches:
      - v3-spatial-depth-je4-opportunity-steered-candidates

permissions:
  contents: read

jobs:
  measure:
    if: github.event.head_commit.message == 'Measure JE4 candidate reachability once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Measure exact candidate reachability
        shell: bash
        env:
          VITE_JE3_REACHABILITY_MEASURE: "1"
        run: |
          set -euo pipefail
          npm exec -- vitest run src/domain/mature-candidate-reachability.measure.test.ts --reporter=verbose 2>&1 | tee je4-reachability-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: je4-reachability-report
          path: je4-reachability-report.txt
          if-no-files-found: error
          retention-days: 14
