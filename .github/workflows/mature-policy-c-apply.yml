name: Apply Mature Fine-Shoot Mechanics C

on:
  push:
    branches:
      - v3-mature-frontier-policy-c

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage mature fine-shoot mechanics C'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-frontier-policy-c

      - name: Reduce post-horizon fine-order light steering
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          old = '''function continuationTropismStrength(order: number, axisModules: number): number {\n  if (order === 0) return 0.16;\n  if (order === 1) {\n    if (axisModules < 6) return 0;\n    return Math.min(0.18, 0.12 + (axisModules - 6) * 0.025);\n  }\n  if (order === 2) return 0.13;\n  if (order === 3) return 0.16;\n  return 0.18;\n}\n'''
          new = '''function continuationTropismStrength(\n  state: TreeState,\n  order: number,\n  axisModules: number,\n): number {\n  let base: number;\n  if (order === 0) base = 0.16;\n  else if (order === 1) {\n    if (axisModules < 6) return 0;\n    base = Math.min(0.18, 0.12 + (axisModules - 6) * 0.025);\n  } else if (order === 2) base = 0.13;\n  else if (order === 3) base = 0.16;\n  else base = 0.18;\n\n  if (state.growthIndex >= MATURE_STRUCTURE_HORIZON && order >= 3) {\n    // Mature fine axes should retain more of their established direction.\n    // Global light seeking still acts, but it no longer repeatedly straightens\n    // every high-order continuation toward the same near-vertical target.\n    return base * (order === 3 ? 0.55 : 0.4);\n  }\n\n  return base;\n}\n'''
          if text.count(old) != 1:
            raise SystemExit(f'continuation function marker count={text.count(old)}')
          text = text.replace(old, new)

          old_call = '      continuationTropismStrength(parent.order, axisModules);'
          new_call = '      continuationTropismStrength(state, parent.order, axisModules);'
          if text.count(old_call) != 1:
            raise SystemExit(f'continuation call marker count={text.count(old_call)}')
          text = text.replace(old_call, new_call)

          path.write_text(text)

      - name: Commit prototype C
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts
          git commit -m "Prototype mature fine-shoot mechanics C"
          git push origin HEAD:v3-mature-frontier-policy-c
