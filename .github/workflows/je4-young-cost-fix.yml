name: Remove JE4 Mature Frontier Cost Before 1k

on:
  push:
    branches:
      - v3-spatial-depth-je4-opportunity-steered-candidates

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage JE4 zero-cost young frontier fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-spatial-depth-je4-opportunity-steered-candidates

      - name: Skip mature frontier derivation before the maturity horizon
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()
          old = '''  const matureContinuationTipIds = deriveScaffoldBalancedMeristemFrontier(\n    state.modules,\n    MATURE_STRUCTURE_HORIZON,\n    MATURE_TIP_STRUCTURAL_WINDOW,\n    MATURE_SCAFFOLD_RESERVE_PER_LINEAGE,\n  ).selectedTipIds;\n'''
          new = '''  // Mature-frontier machinery must have zero cost during the accepted <=1k\n  // phase. It is not consulted until mature continuation eligibility begins.\n  const matureContinuationTipIds: ReadonlySet<string> =\n    state.growthIndex >= MATURE_STRUCTURE_HORIZON\n      ? deriveScaffoldBalancedMeristemFrontier(\n          state.modules,\n          MATURE_STRUCTURE_HORIZON,\n          MATURE_TIP_STRUCTURAL_WINDOW,\n          MATURE_SCAFFOLD_RESERVE_PER_LINEAGE,\n        ).selectedTipIds\n      : new Set<string>();\n'''
          if text.count(old) != 1:
            raise SystemExit(f'mature frontier marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/je4-young-cost-fix.yml
          git add src/domain/structure.ts
          git commit -m "Skip mature frontier derivation before 1k"
          git push origin HEAD:v3-spatial-depth-je4-opportunity-steered-candidates
