name: JE4 Frontier and Spatial Safety Audit

on:
  push:
    branches:
      - v3-spatial-depth-je4-opportunity-steered-candidates

permissions:
  contents: read

jobs:
  measure:
    if: github.event.head_commit.message == 'Audit JE4 frontier and spatial safety once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Measure generated scaffold frontier
        shell: bash
        env:
          VITE_JE1_FRONTIER_BALANCE_MEASURE: "1"
        run: |
          set -euo pipefail
          npm exec -- vitest run src/domain/je1-frontier-balance.measure.test.ts --reporter=verbose 2>&1 | tee je4-frontier-report.txt

      - name: Measure mature spatial safety
        shell: bash
        env:
          VITE_SPATIAL_MATURE_MEASURE: "1"
        run: |
          set -euo pipefail
          npm exec -- vitest run src/domain/spatial-mature.measure.test.ts --reporter=verbose 2>&1 | tee je4-spatial-report.txt

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: je4-safety-audit-reports
          path: |
            je4-frontier-report.txt
            je4-spatial-report.txt
          if-no-files-found: error
          retention-days: 14
