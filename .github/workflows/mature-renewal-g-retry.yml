name: Retry Sympodial Renewal G

on:
  push:
    branches:
      - v3-mature-renewal-g

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry sympodial renewal G implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-renewal-g

      - name: Apply sympodial renewal semantics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 marker, found {count}')
              return text.replace(old, new, 1)

          # structure.ts
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          text = replace_once(text,
              'const HARD_MATURE_ASPECT = 1.02;\n',
              'const HARD_MATURE_ASPECT = 1.02;\n'
              'const MATURE_STRUCTURE_HORIZON = 1000;\n'
              'const MATURE_TIP_STRUCTURAL_WINDOW = 64;\n'
              'const MATURE_SIDE_STRUCTURAL_WINDOW = 48;\n',
              'mature constants')
          text = replace_once(text,
              '  continuationParents: Set<string>;\n  lateralParents: Set<string>;\n',
              '  continuationParents: Set<string>;\n  successorParents: Set<string>;\n  lateralParents: Set<string>;\n',
              'context successor field')
          text = replace_once(text,
              '  lateralFromAxisCounts: Map<string, number>;\n  latestAxisModulePositions: Map<string, number>;\n',
              '  lateralFromAxisCounts: Map<string, number>;\n  modulePositions: Map<string, number>;\n  latestAxisModulePositions: Map<string, number>;\n',
              'context module position field')
          text = replace_once(text,
              '  const continuationParents = new Set<string>();\n  const lateralParents = new Set<string>();\n',
              '  const continuationParents = new Set<string>();\n  const successorParents = new Set<string>();\n  const lateralParents = new Set<string>();\n',
              'context successor set')
          text = replace_once(text,
              '  const lateralFromAxisCounts = new Map<string, number>();\n  const latestAxisModulePositions = new Map<string, number>();\n',
              '  const lateralFromAxisCounts = new Map<string, number>();\n  const modulePositions = new Map<string, number>();\n  const latestAxisModulePositions = new Map<string, number>();\n',
              'context module position map')
          text = replace_once(text,
              '    axisModuleCounts.set(module.axisId, (axisModuleCounts.get(module.axisId) ?? 0) + 1);\n    latestAxisModulePositions.set(module.axisId, index);\n',
              '    axisModuleCounts.set(module.axisId, (axisModuleCounts.get(module.axisId) ?? 0) + 1);\n    modulePositions.set(module.id, index);\n    latestAxisModulePositions.set(module.axisId, index);\n',
              'record module positions')
          text = replace_once(text,
              '    if (module.parentId && module.relation === "continuation") {\n      continuationParents.add(module.parentId);\n    }\n',
              '    if (\n      module.parentId &&\n      (module.relation === "continuation" || module.relation === "renewal")\n    ) {\n      successorParents.add(module.parentId);\n    }\n    if (module.parentId && module.relation === "continuation") {\n      continuationParents.add(module.parentId);\n    }\n',
              'record successor parents')
          text = replace_once(text,
              '    .filter((module) => !continuationParents.has(module.id))\n',
              '    .filter((module) => !successorParents.has(module.id))\n',
              'axis tips use successor slot')
          text = replace_once(text,
              '    continuationParents,\n    lateralParents,\n',
              '    continuationParents,\n    successorParents,\n    lateralParents,\n',
              'return successor context')
          text = replace_once(text,
              '    lateralFromAxisCounts,\n    latestAxisModulePositions,\n',
              '    lateralFromAxisCounts,\n    modulePositions,\n    latestAxisModulePositions,\n',
              'return module position context')

          text = replace_once(text,
              '  if (relation === "continuation") {\n',
              '  if (relation === "continuation" || relation === "renewal") {\n',
              'renewal successor vigor')
          text = replace_once(text,
              '    candidate.relation === "continuation"\n      ? context.latestAxisModulePositions.get(candidate.parent.axisId) ?? -1\n',
              '    candidate.relation === "continuation" || candidate.relation === "renewal"\n      ? context.latestAxisModulePositions.get(candidate.parent.axisId) ?? -1\n',
              'renewal successor recency')

          marker = '  const laterals = context.lateralFromAxisCounts.get(candidate.parent.axisId) ?? 0;\n'
          renewal_arch = '''  if (candidate.relation === "renewal") {\n    const excess = Math.max(0, axisModules - preferred);\n    // Renewal is a successor choice, not an additional branch. It becomes\n    // increasingly competitive only after the fine axis is established.\n    return 0.18 + Math.min(1.35, excess * 0.48);\n  }\n\n'''
          text = replace_once(text, marker, renewal_arch + marker, 'renewal architecture branch')

          text = replace_once(text,
              '  for (const parent of state.modules) {\n    if (parent.order > MAX_ORDER) continue;\n    if (context.continuationParents.has(parent.id)) continue;\n\n    const projection = context.projectedById.get(parent.id);\n',
              '  for (const parent of state.modules) {\n    if (parent.order > MAX_ORDER) continue;\n    if (context.successorParents.has(parent.id)) continue;\n\n    if (eventIndex > MATURE_STRUCTURE_HORIZON) {\n      const latestAxisPosition = context.latestAxisModulePositions.get(parent.axisId);\n      if (latestAxisPosition === undefined) continue;\n      const structuralDormancy = state.modules.length - 1 - latestAxisPosition;\n      if (structuralDormancy > MATURE_TIP_STRUCTURAL_WINDOW) continue;\n    }\n\n    const projection = context.projectedById.get(parent.id);\n',
              'continuation living frontier')

          text = replace_once(text,
              '  for (const parent of state.modules) {\n    if (parent.order >= MAX_ORDER) continue;\n    if (context.lateralParents.has(parent.id)) continue;\n    if (!context.continuationParents.has(parent.id)) continue;\n    if (state.growthIndex - parent.bornAtEvent < MIN_LATERAL_AGE) continue;\n\n    const axisModules = context.axisModuleCounts.get(parent.axisId) ?? 0;\n',
              '  for (const parent of state.modules) {\n    if (parent.order >= MAX_ORDER) continue;\n    if (context.lateralParents.has(parent.id)) continue;\n    if (!context.continuationParents.has(parent.id)) continue;\n    if (state.growthIndex - parent.bornAtEvent < MIN_LATERAL_AGE) continue;\n\n    if (eventIndex > MATURE_STRUCTURE_HORIZON) {\n      if (parent.order === 0) continue;\n      const parentPosition = context.modulePositions.get(parent.id);\n      if (parentPosition === undefined) continue;\n      const structuralAge = state.modules.length - 1 - parentPosition;\n      if (structuralAge > MATURE_SIDE_STRUCTURAL_WINDOW) continue;\n    }\n\n    const axisModules = context.axisModuleCounts.get(parent.axisId) ?? 0;\n',
              'lateral living frontier')

          renewal_fn = '''function renewalCandidates(\n  state: TreeState,\n  context: GrowthContext,\n  eventIndex: number,\n  traits: TreeTraits,\n): Candidate[] {\n  if (eventIndex <= MATURE_STRUCTURE_HORIZON) return [];\n\n  const result: Candidate[] = [];\n\n  for (const parent of state.modules) {\n    if (parent.order !== MAX_ORDER) continue;\n    if (context.successorParents.has(parent.id)) continue;\n\n    const parentPosition = context.modulePositions.get(parent.id);\n    if (parentPosition === undefined) continue;\n    const structuralAge = state.modules.length - 1 - parentPosition;\n    if (structuralAge > MATURE_SIDE_STRUCTURAL_WINDOW) continue;\n\n    const axisModules = context.axisModuleCounts.get(parent.axisId) ?? 0;\n    if (axisModules < preferredAxisModules(MAX_ORDER, traits)) continue;\n\n    const projection = context.projectedById.get(parent.id);\n    if (!projection) continue;\n\n    const divergence =\n      lateralDivergence(state, eventIndex, parent, MAX_ORDER, traits) * 0.55;\n    const length = candidateLength(\n      state,\n      context,\n      eventIndex,\n      parent,\n      "renewal",\n      MAX_ORDER,\n      traits,\n    );\n\n    for (const side of [-1, 1] as const) {\n      const heading = Math.max(\n        -82,\n        Math.min(82, projection.heading + side * divergence),\n      );\n      const scored = scoreCandidate(\n        state,\n        context,\n        eventIndex,\n        {\n          parent,\n          relation: "renewal",\n          axisId: `axis-${eventIndex}`,\n          order: MAX_ORDER,\n          heading,\n          length,\n        },\n        traits,\n      );\n      if (scored) result.push(scored);\n    }\n  }\n\n  return result;\n}\n\n'''
          text = replace_once(text,
              'function initialModule(\n  state: TreeState,\n',
              renewal_fn + 'function initialModule(\n  state: TreeState,\n',
              'insert renewal candidates')
          text = replace_once(text,
              '  if (eventIndex > 5) {\n    candidates = candidates.concat(\n      lateralCandidates(state, context, eventIndex, traits),\n    );\n  } else {\n',
              '  if (eventIndex > 5) {\n    candidates = candidates.concat(\n      lateralCandidates(state, context, eventIndex, traits),\n    );\n    if (eventIndex > MATURE_STRUCTURE_HORIZON) {\n      candidates = candidates.concat(\n        renewalCandidates(state, context, eventIndex, traits),\n      );\n    }\n  } else {\n',
              'add renewal candidate family')
          path.write_text(text)

          # geometry.ts
          path = Path('src/domain/geometry.ts')
          text = path.read_text()
          text = replace_once(text,
              'function curveHandleLength(\n',
              'function isRenewal(relation: GrowthModule["relation"]): boolean {\n  return relation === "renewal";\n}\n\nfunction curveHandleLength(\n',
              'geometry renewal helper')
          text = replace_once(text,
              '  const baseScale = atStart\n    ? relation === "lateral"\n      ? 0.17\n      : 0.24\n    : 0.24;\n',
              '  const baseScale = atStart\n    ? relation === "lateral"\n      ? 0.17\n      : isRenewal(relation)\n        ? 0.2\n        : 0.24\n    : 0.24;\n',
              'renewal handle scale')
          text = replace_once(text,
              '    } else if (module.relation === "lateral" && parentSegment) {\n      startTangent = blendHeading(parentSegment.heading, segment.heading, 0.72);\n    }\n',
              '    } else if (module.relation === "lateral" && parentSegment) {\n      startTangent = blendHeading(parentSegment.heading, segment.heading, 0.72);\n    } else if (module.relation === "renewal" && parentSegment) {\n      startTangent = blendHeading(parentSegment.heading, segment.heading, 0.5);\n    }\n',
              'renewal start tangent')
          text = replace_once(text,
              '    } else if (module.relation === "lateral" && parentCurve) {\n      startThickness = Math.min(\n        segment.thickness * 1.05,\n        parentCurve.endThickness * 0.72,\n      );\n    }\n',
              '    } else if (module.relation === "lateral" && parentCurve) {\n      startThickness = Math.min(\n        segment.thickness * 1.05,\n        parentCurve.endThickness * 0.72,\n      );\n    } else if (module.relation === "renewal" && parentCurve) {\n      startThickness = Math.min(\n        segment.thickness * 1.05,\n        parentCurve.endThickness * 0.86,\n      );\n    }\n',
              'renewal start thickness')
          path.write_text(text)

          # diagnostics.ts
          path = Path('src/domain/diagnostics.ts')
          text = path.read_text()
          text = replace_once(text, '  if (state.schemaVersion !== 2) {', '  if (state.schemaVersion !== 3) {', 'schema diagnostic')
          text = replace_once(text,
              '  const relationByParent = new Map<string, Set<string>>();\n',
              '  const relationByParent = new Map<string, Set<string>>();\n  const successorParents = new Set<string>();\n',
              'diagnostic successor set')
          text = replace_once(text,
              '      } else if (module.relation === "lateral") {\n        if (module.axisId === parent.axisId) {\n          errors.push(`lateral ${module.id} must create a new axis`);\n        }\n        if (module.order !== parent.order + 1) {\n          errors.push(`lateral ${module.id} must increment branch order`);\n        }\n      } else {\n',
              '      } else if (module.relation === "lateral") {\n        if (module.axisId === parent.axisId) {\n          errors.push(`lateral ${module.id} must create a new axis`);\n        }\n        if (module.order !== parent.order + 1) {\n          errors.push(`lateral ${module.id} must increment branch order`);\n        }\n      } else if (module.relation === "renewal") {\n        if (module.axisId === parent.axisId) {\n          errors.push(`renewal ${module.id} must create a new axis`);\n        }\n        if (module.order !== parent.order || module.order !== 4) {\n          errors.push(`renewal ${module.id} must preserve fine order 4`);\n        }\n        if (module.bornAtEvent <= 1000) {\n          errors.push(`renewal ${module.id} cannot predate mature horizon`);\n        }\n      } else {\n',
              'diagnostic renewal invariants')
          text = replace_once(text,
              '      const relations = relationByParent.get(module.parentId) ?? new Set<string>();\n',
              '      if (module.relation === "continuation" || module.relation === "renewal") {\n        if (successorParents.has(module.parentId)) {\n          errors.push(`parent ${module.parentId} has more than one successor child`);\n        }\n        successorParents.add(module.parentId);\n      }\n\n      const relations = relationByParent.get(module.parentId) ?? new Set<string>();\n',
              'diagnostic successor uniqueness')
          text = replace_once(text,
              '      module?.relation === "lateral" &&\n      parent &&\n',
              '      (module?.relation === "lateral" || module?.relation === "renewal") &&\n      parent &&\n',
              'diagnostic renewal diameter')
          path.write_text(text)

          # mature-frontier.ts
          path = Path('src/domain/mature-frontier.ts')
          text = path.read_text()
          text = replace_once(text, '  postHorizonLaterals: number;\n', '  postHorizonLaterals: number;\n  postHorizonRenewals: number;\n', 'frontier renewal field')
          text = replace_once(text,
              '  const postLaterals = postHorizon.filter(\n    (module) => module.relation === "lateral",\n  );\n',
              '  const postLaterals = postHorizon.filter(\n    (module) => module.relation === "lateral",\n  );\n  const postRenewals = postHorizon.filter(\n    (module) => module.relation === "renewal",\n  );\n',
              'frontier renewal count')
          text = replace_once(text, '    postHorizonLaterals: postLaterals.length,\n', '    postHorizonLaterals: postLaterals.length,\n    postHorizonRenewals: postRenewals.length,\n', 'frontier renewal return')
          path.write_text(text)

          # mature-frontier.test.ts
          path = Path('src/domain/mature-frontier.test.ts')
          text = path.read_text()
          text = replace_once(text,
              '      first.postHorizonContinuations + first.postHorizonLaterals,\n    ).toBe(first.postHorizonModules);\n',
              '      first.postHorizonContinuations +\n        first.postHorizonLaterals +\n        first.postHorizonRenewals,\n    ).toBe(first.postHorizonModules);\n',
              'frontier test relation sum')
          text = replace_once(text,
              '    expect(diagnostics.postHorizonLaterals).toBe(0);\n',
              '    expect(diagnostics.postHorizonLaterals).toBe(0);\n    expect(diagnostics.postHorizonRenewals).toBe(0);\n',
              'frontier test renewal boundary')
          path.write_text(text)

      - name: Commit prototype G
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts src/domain/geometry.ts src/domain/diagnostics.ts src/domain/mature-frontier.ts src/domain/mature-frontier.test.ts
          git commit -m "Prototype sympodial mature renewal G"
          git push origin HEAD:v3-mature-renewal-g
