name: Apply Spatial Depth J Phase B

on:
  push:
    branches:
      - v3-spatial-depth-jb

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage persisted zero-depth schema Phase B'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-spatial-depth-jb

      - name: Apply zero-depth persistence plumbing
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name, replacements):
            path = Path(path_name)
            text = path.read_text()
            for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{path_name}:{label}: expected 1 marker, found {count}')
              text = text.replace(old, new, 1)
            path.write_text(text)

          patch('src/domain/structure.ts', [
            (
              '    restLength: keyedRange(\n      state.soul,\n      `structure:${eventIndex}:origin:length`,\n      21,\n      25,\n    ),\n  };\n',
              '    restLength: keyedRange(\n      state.soul,\n      `structure:${eventIndex}:origin:length`,\n      21,\n      25,\n    ),\n    restDepth: 0,\n  };\n',
              'origin restDepth',
            ),
            (
              '    restTurn: winner.heading - parentProjection.heading,\n    restLength: winner.length,\n  };\n',
              '    restTurn: winner.heading - parentProjection.heading,\n    restLength: winner.length,\n    restDepth: 0,\n  };\n',
              'winner restDepth',
            ),
          ])

          patch('src/domain/diagnostics.ts', [
            (
              '  if (state.schemaVersion !== 2) {',
              '  if (state.schemaVersion !== 3) {',
              'schema version',
            ),
            (
              '    if (!Number.isFinite(module.restTurn)) {\n      errors.push(`invalid rest turn for ${module.id}`);\n    }\n',
              '    if (!Number.isFinite(module.restTurn)) {\n      errors.push(`invalid rest turn for ${module.id}`);\n    }\n    if (!Number.isFinite(module.restDepth)) {\n      errors.push(`invalid rest depth for ${module.id}`);\n    }\n',
              'rest depth validation',
            ),
          ])

          # Make persisted module depth the default spatial projection input.
          path = Path('src/domain/spatial-geometry.ts')
          text = path.read_text()
          text = text.replace(
            '  depthDeltaByModule: ReadonlyMap<string, number> = new Map(),\n',
            '  depthDeltaByModule?: ReadonlyMap<string, number>,\n',
          )
          text = text.replace(
            '  const spatialById = new Map<string, ProjectedSpatialSegment>();\n',
            '  const spatialById = new Map<string, ProjectedSpatialSegment>();\n  const moduleById = new Map(state.modules.map((module) => [module.id, module]));\n',
          )
          old = '    const delta = depthDeltaByModule.get(segment.id) ?? 0;\n'
          new = '''    const module = moduleById.get(segment.id);\n    if (!module) {\n      throw new Error(`Spatial segment ${segment.id} has no growth module`);\n    }\n    const delta = depthDeltaByModule?.get(segment.id) ?? module.restDepth;\n'''
          if text.count(old) != 1:
            raise SystemExit(f'spatial-geometry delta marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)

          patch('src/domain/longevity.test.ts', [
            ('    schemaVersion: 2,\n', '    schemaVersion: 3,\n', 'prefix schema'),
            ('  expect(state.schemaVersion).toBe(2);\n', '  expect(state.schemaVersion).toBe(3);\n', 'state schema'),
            (
              '  const moduleById = new Map(state.modules.map((module) => [module.id, module]));\n',
              '  const moduleById = new Map(state.modules.map((module) => [module.id, module]));\n  expect(\n    state.modules.every((module) => module.restDepth === 0),\n    "Phase B must preserve the existing planar history exactly",\n  ).toBe(true);\n',
              'zero depth long history',
            ),
          ])

      - name: Commit Phase B plumbing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts src/domain/diagnostics.ts src/domain/spatial-geometry.ts src/domain/longevity.test.ts
          git commit -m "Persist zero developmental depth in schema V3"
          git push origin HEAD:v3-spatial-depth-jb
