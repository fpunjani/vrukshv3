name: Foliage attachment acceptance

on:
  push:
    branches:
      - v3-foliage-attachment

permissions:
  contents: write

jobs:
  accept:
    if: ${{ !contains(github.event.head_commit.message, 'Record foliage attachment visual gate') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-foliage-attachment

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Render attachment matrices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/foliage-attachments
          npm exec vite -- preview --host 127.0.0.1 --port 4173 > /tmp/vruksh-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"

          for count in 30 100 300 1000; do
            "$chrome" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --window-size=1600,5000 \
              --screenshot="qa/foliage-attachments/count-${count}.png" \
              "http://127.0.0.1:4173/?count=${count}&soul=ash-01&attachments=1"
          done

          printf 'PASS\nbranch=v3-foliage-attachment\nsource=%s\n' "$GITHUB_SHA" > qa/FOLIAGE_GATE_OK.txt

      - name: Record visual gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/FOLIAGE_GATE_OK.txt qa/foliage-attachments
          git commit -m "Record foliage attachment visual gate"
          git push origin HEAD:v3-foliage-attachment
