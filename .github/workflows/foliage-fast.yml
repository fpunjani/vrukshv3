name: Foliage fast gate

on:
  push:
    branches:
      - v3-foliage-attachment
    paths:
      - src/domain/foliage.ts
      - src/domain/foliage-diagnostics.ts
      - src/domain/foliage-diagnostics.test.ts
      - .github/workflows/foliage-fast.yml

permissions:
  contents: read

jobs:
  foliage-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run src/domain/foliage-diagnostics.test.ts
