name: Apply Balanced Mature Dormancy B

on:
  push:
    branches:
      - v3-mature-frontier-policy-b

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage balanced mature dormancy B'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-frontier-policy-b

      - name: Soften mature dormancy decay
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          replacements = {
            '    if (structuralAge <= 24) return 0;': '    if (structuralAge <= 50) return 0;',
            '    const baseDecay = (structuralAge - 24) * 0.012;': '    const baseDecay = (structuralAge - 50) * 0.007;',
            '    const deepDormancy = Math.max(0, structuralAge - 100) * 0.004;': '    const deepDormancy = Math.max(0, structuralAge - 140) * 0.0025;',
            '    return Math.min(2.4, baseDecay + deepDormancy);': '    return Math.min(1.6, baseDecay + deepDormancy);',
            '  if (dormancyGap <= 24) return 0;': '  if (dormancyGap <= 50) return 0;',
            '  const baseDecay = (dormancyGap - 24) * 0.008;': '  const baseDecay = (dormancyGap - 50) * 0.0045;',
            '  const deepDormancy = Math.max(0, dormancyGap - 100) * 0.004;': '  const deepDormancy = Math.max(0, dormancyGap - 140) * 0.002;',
            '  return Math.min(1.8, baseDecay + deepDormancy);': '  return Math.min(1.2, baseDecay + deepDormancy);',
          }

          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'expected exactly one occurrence: {old!r}, found {text.count(old)}')
            text = text.replace(old, new)

          path.write_text(text)

      - name: Commit prototype B
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts
          git commit -m "Prototype balanced mature dormancy B"
          git push origin HEAD:v3-mature-frontier-policy-b
