name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Capture Tree Lab visual gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-gate/skeleton visual-gate/attachments
          npm exec vite -- preview --host 127.0.0.1 --port 4173 > /tmp/vruksh-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable found on runner" >&2
            exit 1
          fi

          for count in 30 100 300 1000; do
            "$chrome" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --window-size=1600,5000 \
              --screenshot="visual-gate/skeleton/count-${count}.png" \
              "http://127.0.0.1:4173/?count=${count}&soul=ash-01"

            "$chrome" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --window-size=1600,5000 \
              --screenshot="visual-gate/attachments/count-${count}.png" \
              "http://127.0.0.1:4173/?count=${count}&soul=ash-01&attachments=1"
          done

      - name: Upload Tree Lab visual gate
        uses: actions/upload-artifact@v7
        with:
          name: tree-lab-visual-gate
          path: visual-gate
          if-no-files-found: error
          retention-days: 14
