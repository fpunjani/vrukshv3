name: JE0 Corrected Scaffold Frontier Measure

on:
  push:
    branches:
      - v3-spatial-depth-je0-successor

permissions:
  contents: read

jobs:
  measure:
    if: github.event.head_commit.message == 'Measure corrected JE0 scaffold frontier once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Measure corrected living frontier
        shell: bash
        env:
          VITE_JE0_FRONTIER_BALANCE_MEASURE: "1"
        run: |
          set -euo pipefail
          npm exec -- vitest run src/domain/je0-frontier-balance.measure.test.ts --reporter=verbose 2>&1 | tee je0-frontier-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: je0-frontier-report
          path: je0-frontier-report.txt
          if-no-files-found: error
          retention-days: 14
