name: Apply Bounded Mature Ramification I

on:
  push:
    branches:
      - v3-mature-ramification-i

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage bounded mature ramification I'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-ramification-i

      - name: Apply mature envelope to F ramification
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()

          def once(old, new, label):
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 marker, found {count}')
            text = text.replace(old, new, 1)

          once(
            '  bounds: Bounds;\n  continuationParents: Set<string>;\n',
            '  bounds: Bounds;\n  matureReferenceBounds: Bounds;\n  continuationParents: Set<string>;\n',
            'context mature bounds field',
          )
          once(
            '  const projectedById = new Map(segments.map((segment) => [segment.id, segment]));\n',
            '  const projectedById = new Map(segments.map((segment) => [segment.id, segment]));\n  const matureReferenceBounds = boundsFor(\n    segments.filter((segment) => segment.bornAtEvent <= MATURE_STRUCTURE_HORIZON),\n  );\n',
            'compute reference bounds',
          )
          once(
            '    bounds: boundsFor(segments),\n    continuationParents,\n',
            '    bounds: boundsFor(segments),\n    matureReferenceBounds,\n    continuationParents,\n',
            'return reference bounds',
          )

          helper = '''function insideMatureCrownEnvelope(\n  context: GrowthContext,\n  eventIndex: number,\n  end: Point,\n): boolean {\n  if (eventIndex <= MATURE_STRUCTURE_HORIZON) return true;\n\n  const ageRatio = Math.max(1, eventIndex / MATURE_STRUCTURE_HORIZON);\n  const ageLog = Math.log2(ageRatio);\n  const horizontalScale = 1 + ageLog * 0.18;\n  const verticalScale = 1 + ageLog * 0.14;\n  const reference = context.matureReferenceBounds;\n  const cushion = 6;\n\n  return (\n    end.x >= reference.minX * horizontalScale - cushion - 1e-9 &&\n    end.x <= reference.maxX * horizontalScale + cushion + 1e-9 &&\n    end.y >= reference.minY * verticalScale - cushion - 1e-9 &&\n    end.y <= 1e-9\n  );\n}\n\n'''
          once('function violatesBroadCrownEnvelope(\n', helper + 'function violatesBroadCrownEnvelope(\n', 'insert envelope helper')
          once(
            '  if (candidate.length <= 0.5) return null;\n  if (violatesBroadCrownEnvelope(context.bounds, end, state.modules.length)) {\n',
            '  if (candidate.length <= 0.5) return null;\n  if (!insideMatureCrownEnvelope(context, eventIndex, end)) return null;\n  if (violatesBroadCrownEnvelope(context.bounds, end, state.modules.length)) {\n',
            'enforce mature envelope',
          )

          path.write_text(text)

      - name: Commit I
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/structure.ts
          git commit -m "Prototype bounded mature ramification I"
          git push origin HEAD:v3-mature-ramification-i
