name: Patch G Longevity Assertions

on:
  push:
    branches:
      - v3-mature-renewal-g

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch G longevity renewal assertions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-mature-renewal-g

      - name: Patch longevity test
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/longevity.test.ts')
          text = path.read_text()

          def once(old, new, label):
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 marker, found {count}')
            text = text.replace(old, new, 1)

          once('    schemaVersion: 2,\n', '    schemaVersion: 3,\n', 'historical schema')
          once('  expect(state.schemaVersion).toBe(2);\n', '  expect(state.schemaVersion).toBe(3);\n', 'schema assertion')

          helper = '''function validateRenewalHistory(state: TreeState): void {\n  const moduleById = new Map(state.modules.map((module) => [module.id, module]));\n  const successorCount = new Map<string, number>();\n\n  for (const module of state.modules) {\n    if (\n      module.parentId &&\n      (module.relation === "continuation" || module.relation === "renewal")\n    ) {\n      successorCount.set(\n        module.parentId,\n        (successorCount.get(module.parentId) ?? 0) + 1,\n      );\n    }\n\n    if (module.relation !== "renewal") continue;\n    expect(module.bornAtEvent, `renewal ${module.id} mature birth`).toBeGreaterThan(1000);\n    expect(module.order, `renewal ${module.id} fine order`).toBe(4);\n    const parent = module.parentId ? moduleById.get(module.parentId) : undefined;\n    expect(parent, `renewal ${module.id} parent exists`).toBeDefined();\n    expect(parent?.order, `renewal ${module.id} same tier`).toBe(4);\n    expect(module.axisId, `renewal ${module.id} new axis`).not.toBe(parent?.axisId);\n  }\n\n  for (const [parentId, count] of successorCount) {\n    expect(count, `parent ${parentId} successor slot`).toBeLessThanOrEqual(1);\n  }\n\n  expect(\n    state.modules.reduce((max, module) => Math.max(max, module.order), 0),\n    "sympodial renewal must keep hierarchy bounded",\n  ).toBeLessThanOrEqual(4);\n}\n\n'''
          once('function validateLongHistory(state: TreeState, expectedEntries: number): void {\n', helper + 'function validateLongHistory(state: TreeState, expectedEntries: number): void {\n', 'renewal helper insertion')

          once('  expect(Number.isFinite(structure.aspectRatio)).toBe(true);\n\n  expect(state.modules.length).toBeGreaterThan(50);\n', '  expect(Number.isFinite(structure.aspectRatio)).toBe(true);\n  validateRenewalHistory(state);\n\n  expect(state.modules.length).toBeGreaterThan(50);\n', 'renewal validation call')

          once('      validateLongHistory(at30000, 30000);\n\n      expectBucketPrefixStable(at3000, at10000, "module");\n', '      validateLongHistory(at30000, 30000);\n      expect(\n        at30000.modules.some((module) => module.relation === "renewal"),\n        "30k organism should exercise mature sympodial renewal",\n      ).toBe(true);\n\n      expectBucketPrefixStable(at3000, at10000, "module");\n', 'renewal exercised assertion')

          path.write_text(text)

      - name: Commit assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/longevity.test.ts
          git commit -m "Gate sympodial renewal in long-life reconstruction"
          git push origin HEAD:v3-mature-renewal-g
