name: Apply JE6 Neutral Mature Fine Architecture

on:
  push:
    branches:
      - v3-spatial-depth-je6-neutral-mature-fine-architecture

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage JE6 neutral mature fine architecture'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-spatial-depth-je6-neutral-mature-fine-architecture

      - name: Neutralize mature order-3/4 continuation architecture only
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/domain/structure.ts')
          text = path.read_text()
          old = '''  if (candidate.relation === "continuation") {\n    const deficit = Math.max(0, preferred - axisModules);\n    const excess = Math.max(0, axisModules - preferred);\n\n    if (candidate.order === 0) {\n'''
          new = '''  if (candidate.relation === "continuation") {\n    // JE6: juvenile fine-axis length shaping is not a lifetime merit signal.\n    // Preserve it exactly through 1k, but once the organism is mature,\n    // established fine continuations compete on space/opportunity/mechanics\n    // rather than being rewarded for shortness or punished for survival length.\n    if (\n      state.growthIndex >= MATURE_STRUCTURE_HORIZON &&\n      candidate.order >= 3\n    ) {\n      return 0;\n    }\n\n    const deficit = Math.max(0, preferred - axisModules);\n    const excess = Math.max(0, axisModules - preferred);\n\n    if (candidate.order === 0) {\n'''
          if text.count(old) != 1:
            raise SystemExit(f'architecture marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Commit JE6 and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/je6-apply.yml
          git add src/domain/structure.ts
          git commit -m "Neutralize mature fine continuation architecture"
          git push origin HEAD:v3-spatial-depth-je6-neutral-mature-fine-architecture
