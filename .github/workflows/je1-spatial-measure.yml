name: JE1 Spatial Mature Measure

on:
  push:
    branches:
      - v3-spatial-depth-je1-balanced-meristems

permissions:
  contents: read

jobs:
  measure:
    if: github.event.head_commit.message == 'Measure JE1 spatial use once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Measure spatial mature use
        shell: bash
        env:
          VITE_SPATIAL_MATURE_MEASURE: "1"
        run: |
          set -euo pipefail
          npm exec -- vitest run src/domain/spatial-mature.measure.test.ts --reporter=verbose 2>&1 | tee je1-spatial-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: je1-spatial-mature-report
          path: je1-spatial-report.txt
          if-no-files-found: error
          retention-days: 14
